name: Approval watchdog

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Tehran"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Non-applying v0.1 safety boundary
        run: |
          echo "The v0.1 watchdog is intentionally non-applying."
          echo "Persistence, reminders, and safe-package dispatch are implemented in later milestones."
