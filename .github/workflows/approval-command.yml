name: Reconcile approval commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: fgops-approval-state
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      ${{ !github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/fg ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch canonical issue and complete command history
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq .body > issue.md
          gh api --paginate --slurp \
            "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq 'add' > comments.json
      - name: Verify signed state and reconcile every unprocessed command
        env:
          FGOPS_APPROVAL_HMAC_KEY: ${{ secrets.FGOPS_APPROVAL_HMAC_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          fgops approval-reconcile issue.md comments.json \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --output-body updated-issue.md \
            --output-response response.md \
            > result.json
      - name: Persist reconciled state
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if test "$(jq -r .changed result.json)" = "true"; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$REPOSITORY" \
              --body-file updated-issue.md
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file response.md
      - name: Record fail-closed rejection
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY"
          --body "FGOps rejected the command because signed-state verification or deterministic reconciliation failed. No device action was attempted."
