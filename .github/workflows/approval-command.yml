name: Approval command validation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: >-
      ${{ !github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/fg ') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Validate command grammar
        env:
          FGOPS_COMMAND: ${{ github.event.comment.body }}
        run: fgops approval-command "$FGOPS_COMMAND"
      - name: Record validation response
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY"
          --body "FGOps accepted the command syntax. State mutation will be enabled after the persistence layer is merged."
