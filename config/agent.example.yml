# Copy this file outside the repository before adding production values.
package_map: fortios64-package-map.yml

source:
  page_url: "https://www.cyberlogic.ir/%D8%A8%D8%B1%D9%88%D8%B2-%D8%B1%D8%B3%D8%A7%D9%86%DB%8C-%D8%A2%D9%81%D9%84%D8%A7%DB%8C%D9%86-fortigate-%D9%88-fortiweb/"
  link_text_regex: '(?i)Fortigate\s+V6\.4'
  timeout_seconds: 60
  max_download_bytes: 536870912
  tls_mode: system

storage:
  root: C:/ProgramData/FGOps
  incoming: incoming
  quarantine: quarantine
  reports: reports
  evidence: evidence
  tftp: tftp
  state_file: state/agent-state.json

execution:
  # First live use must remain approval. Change to unattended only after reviewing
  # at least one complete backup/apply/postflight evidence set.
  mode: approval
  enabled_packages: [AV, IPS, APDB, FFDB, MCDB, MMDB]
  reject_unknown_packages: true
  prevent_downgrade: true

# Obtain the fingerprint with `fgops-agent scan-host-key`, verify it through a
# separate trusted path, then pin the verified value here.
device:
  host: 172.16.1.2
  port: 22
  username: admin
  host_key_sha256: SHA256:REPLACE_WITH_VERIFIED_FINGERPRINT
  password_env: FGOPS_SSH_PASSWORD
  # key_file: C:/ProgramData/FGOps/keys/fgops_ed25519
  # key_passphrase_env: FGOPS_SSH_KEY_PASSPHRASE
  connect_timeout_seconds: 20
  command_timeout_seconds: 120
  expected_hostname: SITEC-FW-02
  expected_model: FortiGate-300D
  expected_firmware_branch: "6.4"
  expected_build: 2098
  global_context: true

apply:
  # Bind only to the dedicated management-facing VM address. FortiOS restore
  # commands do not carry a custom TFTP port, so UDP/69 is mandatory.
  tftp_bind_address: 192.168.1.179
  tftp_advertise_address: 192.168.1.179
  tftp_port: 69
  require_backup: true
  backup_password_env: FGOPS_BACKUP_PASSWORD
  settle_seconds: 5
  stop_on_failure: true
  package_order: [AV, IPS, APDB, FFDB, MCDB, MMDB]
